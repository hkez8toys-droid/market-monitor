name: Minervini - Daily Screener (05:40 HKT)

on:
  workflow_dispatch:
  schedule:
    - cron: "40 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: minervini-sheet-writer
  cancel-in-progress: false

jobs:
  minervini:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install screener dependencies
        run: python -m pip install -r minervini/requirements.txt
      - name: Scan and append to Minervini worksheet
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python -u -m minervini.run
