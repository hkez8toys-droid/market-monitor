name: PreMarket - Minute Data Check (20:15 HKT)

on:
  schedule:
    # UTC 12:15 = Hong Kong 20:15, Monday-Friday.
    - cron: "15 12 * * 1-5"
  workflow_dispatch:
    inputs:
      scope:
        description: "watchlist = EOD + Minervini; probe = AAPL/MSFT/SPY only"
        type: choice
        default: watchlist
        options:
          - watchlist
          - probe

permissions:
  contents: read

concurrency:
  group: premarket-check-sheet-writer
  cancel-in-progress: false

jobs:
  premarket-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements_premarket.txt
      - name: Verify session and data-quality checks
        run: python -m unittest test_premarket_check -v
      - name: Check premarket minute bars and save diagnostic snapshot
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CHECK_SCOPE: ${{ github.event_name == 'schedule' && 'probe' || inputs.scope || 'probe' }}
        run: python -u premarket_check.py --scope "$CHECK_SCOPE"
